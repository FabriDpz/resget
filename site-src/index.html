<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Immobiliare — Multi-portale</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">🏠 Radar<span>analisi immobiliare multi-portale</span></div>
    <nav id="portal-nav"></nav>
    <div class="sidebar-footer">
      <div id="meta"></div>
      <div class="disclaimer">Margini e punteggi sono <strong>stime indicative</strong> (parametri in flip-config.mjs), non perizie.</div>
    </div>
  </aside>
  <div id="nav-backdrop" class="nav-backdrop"></div>
  <main class="main">
    <header class="topbar">
      <div class="title-row">
        <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Apri il menu di navigazione" aria-expanded="false">☰</button>
        <h1 id="view-title">Dashboard</h1>
      </div>
      <div class="controls">
        <input type="search" id="q" placeholder="Cerca (zona, titolo, ID, agenzia…)">
        <select id="f-zona"><option value="">Tutte le zone</option></select>
        <select id="f-stato"><option value="">Tutti gli stati</option></select>
        <select id="f-extra" class="hidden"></select>
        <button id="btn-csv" type="button" title="Esporta la vista corrente (righe filtrate e ordinate) in CSV">⬇ CSV</button>
        <select id="f-tema" title="Tema grafico (dal chiaro allo scuro)" aria-label="Tema grafico"></select>
      </div>
      <button id="btn-chat" type="button" title="Assistente: cerca e confronta annunci in linguaggio naturale" aria-expanded="false">💬</button>
    </header>
    <section id="dashboard" class="hidden"></section>
    <section id="table-wrap">
      <div id="count" class="count"></div>
      <div class="table-scroll"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    </section>
  </main>
  <aside id="chat-panel" class="chat-panel" aria-label="Assistente radar">
    <div id="chat-resizer" class="chat-resizer" title="Trascina per ridimensionare" role="separator" aria-orientation="vertical" aria-label="Ridimensiona il pannello assistente" tabindex="0"></div>
    <div class="chat-head">
      <span class="chat-title">💬 Assistente radar</span>
      <span id="chat-model" class="chat-model"></span>
      <button id="chat-close" type="button" aria-label="Chiudi la chat">✕</button>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <div id="chat-chips" class="chat-chips"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Es. trilocali a San Lazzaro sotto 130k da ristrutturare" autocomplete="off" maxlength="500">
      <button id="chat-send" type="submit" aria-label="Invia">➤</button>
    </form>
  </aside>
  <div id="chat-backdrop" class="chat-backdrop"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
